---
- name: Enable elasticsearch service
  ansible.builtin.service:
    name: elasticsearch
    enabled: yes

- name: Template Elasticsearch configuration
  register: es_configuration
  ansible.builtin.template:
    src: "elasticsearch/elasticsearch.yml.j2"
    dest: "{{ elasticsearch.prefix.config }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0664"
  notify: Restart Elasticsearch

- name: Configure Elasticsearch (log4j2.properties)
  register: log4j2_configuration
  ansible.builtin.lineinfile:
    path: "{{ config_filepath }}"
    regexp: "^{{ item.key | regex_escape }}[\\s\\t]*="
    line: "{{ item.key }} = {{ item.value }}"
    state: "{{ 'present' if item.value is not none else 'absent' }}"
  loop_control:
    label: "{{ config_filepath }} {{ item.key }}={{ item.value }}"
  with_dict: "{{ elasticsearch['log4j2.properties'] }}"
  vars:
    config_filepath: "{{ elasticsearch.prefix.config }}/log4j2.properties"
  notify: Restart Elasticsearch

- name: Create directory for JVM options
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.config }}/jvm.options.d"
    group: elasticsearch
    mode: "u+rwx,g+rx"
    state: directory

- name: Find heap sizes set outside of this role
  when: elasticsearch['jvm.options']['-Xmx'] is not none
  register: elasticsearch_heap_files
  changed_when: false
  failed_when: false
  check_mode: false
  ansible.builtin.shell:
    cmd: grep -sH '^-Xmx' jvm.options jvm.options.d/*.options
    chdir: "{{ elasticsearch.prefix.config }}"

# The 1g default is meant to be sized per host, so point at hosts where it replaces a different heap
- name: Warn when this role overrides a heap size set elsewhere
  when: elasticsearch_heap_conflicts | length > 0
  vars:
    elasticsearch_heap_conflicts: >-
      {{ elasticsearch_heap_files.stdout_lines | default([])
         | reject('match', 'jvm\.options\.d/zz-ansible\.options:')
         | reject('search', (':-Xmx' ~ elasticsearch['jvm.options']['-Xmx']) | regex_escape ~ '$')
         | list }}
  ansible.builtin.debug:
    msg:
      - "WARNING: Elasticsearch runs with -Xmx{{ elasticsearch['jvm.options']['-Xmx'] }} from jvm.options.d/zz-ansible.options,"
      - "which overrides these heap settings in {{ elasticsearch.prefix.config }}:"
      - "{{ elasticsearch_heap_conflicts }}"
      - "Check how much memory this host needs and set elasticsearch['jvm.options']['-Xms'] and ['-Xmx'] in the inventory."

# ES reads jvm.options, then jvm.options.d/*.options by name, and the last value wins: zz- beats e.g. the proServer blueprint's heap-size.options
- name: Configure Elasticsearch (jvm.options.d)
  register: jvm_configuration
  ansible.builtin.copy:
    dest: "{{ elasticsearch.prefix.config }}/jvm.options.d/zz-ansible.options"
    owner: root
    group: elasticsearch
    mode: "0644"
    content: |
      # Managed by Ansible (ansible-proserver-elasticsearch)
      {% for key, value in elasticsearch['jvm.options'].items() if value is not none %}
      {{ key }}{{ value }}
      {% endfor %}
  notify: Restart Elasticsearch

- name: Remove options from jvm.options that are now set in jvm.options.d
  register: jvm_options_cleanup
  ansible.builtin.lineinfile:
    path: "{{ elasticsearch.prefix.config }}/jvm.options"
    regexp: "^{{ item.key | regex_escape }}"
    state: absent
  loop_control:
    label: "{{ item.key }}"
  with_dict: "{{ elasticsearch['jvm.options'] }}"
  notify: Restart Elasticsearch

- name: Configure Java for Elasticsearch (FreeBSD)
  when:
    - ansible_facts['system'] == 'FreeBSD'
    - elasticsearch.java_home | default('', true) | length > 0
  block:
    - name: Check if the configured Java exists
      register: elasticsearch_java_binary
      ansible.builtin.stat:
        path: "{{ elasticsearch.java_home }}/bin/java"

    # Pinning a missing Java would keep Elasticsearch from starting
    - name: Ensure the configured Java exists
      ansible.builtin.assert:
        that: elasticsearch_java_binary.stat.exists
        fail_msg: >-
          {{ elasticsearch.java_home }}/bin/java does not exist.
          Install the matching OpenJDK package or set elasticsearch.java_home to an installed Java.

    - name: Configure Elasticsearch (Java home)
      register: java_home_configuration
      ansible.builtin.lineinfile:
        path: /usr/local/etc/rc.conf.d/elasticsearch
        regexp: "^elasticsearch_java_home="
        line: 'elasticsearch_java_home="{{ elasticsearch.java_home }}"'
        create: yes
        owner: root
        group: wheel
        mode: "0644"
      notify: Restart Elasticsearch

- name: Create directory for Elasticsearch scripts
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: elasticsearch
    mode: "0775"
    state: directory
  with_items:
    - "{{ elasticsearch.prefix.config }}/scripts"
  notify: Restart Elasticsearch

- name: Create directory for Elasticsearch data
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.data }}"
    owner: elasticsearch
    group: elasticsearch
    mode: "0755"
    state: directory

- name: Allow Elasticsearch to update its own configuration
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.config }}"
    state: directory
    group: elasticsearch
    mode: g+rwx

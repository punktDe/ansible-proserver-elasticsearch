---
- name: Enable elasticsearch service
  ansible.builtin.service:
    name: elasticsearch
    enabled: yes

- name: Template Elasticsearch configuration
  register: es_configuration
  ansible.builtin.template:
    src: "elasticsearch/elasticsearch.yml.j2"
    dest: "{{ elasticsearch.prefix.config }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0664"
  notify: Restart Elasticsearch

- name: Configure Elasticsearch (log4j2.properties)
  register: log4j2_configuration
  ansible.builtin.lineinfile:
    path: "{{ config_filepath }}"
    regexp: "^{{ item.key | regex_escape }}[\\s\\t]*="
    line: "{{ item.key }} = {{ item.value }}"
    state: "{{ 'present' if item.value is not none else 'absent' }}"
  loop_control:
    label: "{{ config_filepath }} {{ item.key }}={{ item.value }}"
  with_dict: "{{ elasticsearch['log4j2.properties'] }}"
  vars:
    config_filepath: "{{ elasticsearch.prefix.config }}/log4j2.properties"
  notify: Restart Elasticsearch

- name: Create directory for JVM options
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.config }}/jvm.options.d"
    group: elasticsearch
    mode: "u+rwx,g+rx"
    state: directory

# ES reads jvm.options, then jvm.options.d/*.options by name, and the last value wins: zz- beats e.g. the proServer blueprint's heap-size.options
- name: Configure Elasticsearch (jvm.options.d)
  register: jvm_configuration
  ansible.builtin.copy:
    dest: "{{ elasticsearch.prefix.config }}/jvm.options.d/zz-ansible.options"
    owner: root
    group: elasticsearch
    mode: "0644"
    content: |
      # Managed by Ansible (ansible-proserver-elasticsearch)
      {% for key, value in elasticsearch['jvm.options'].items() if value is not none %}
      {{ key }}{{ value }}
      {% endfor %}
  notify: Restart Elasticsearch

- name: Remove options from jvm.options that are now set in jvm.options.d
  register: jvm_options_cleanup
  ansible.builtin.lineinfile:
    path: "{{ elasticsearch.prefix.config }}/jvm.options"
    regexp: "^{{ item.key | regex_escape }}"
    state: absent
  loop_control:
    label: "{{ item.key }}"
  with_dict: "{{ elasticsearch['jvm.options'] }}"
  notify: Restart Elasticsearch

- name: Create directory for Elasticsearch scripts
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: elasticsearch
    mode: "0775"
    state: directory
  with_items:
    - "{{ elasticsearch.prefix.config }}/scripts"
  notify: Restart Elasticsearch

- name: Create directory for Elasticsearch data
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.data }}"
    owner: elasticsearch
    group: elasticsearch
    mode: "0755"
    state: directory

- name: Allow Elasticsearch to update its own configuration
  ansible.builtin.file:
    path: "{{ elasticsearch.prefix.config }}"
    state: directory
    group: elasticsearch
    mode: g+rwx

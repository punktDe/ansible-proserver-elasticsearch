---
- name: Ensure Elasticsearch is not exposed without authentication
  when: not elasticsearch_yml.xpack.security.enabled
  vars:
    elasticsearch_yml: "{{ elasticsearch['elasticsearch.yml'] }}"
    elasticsearch_loopback: ["_local_", "127.0.0.1", "::1", "localhost"]
  ansible.builtin.assert:
    that:
      - not elasticsearch.use_dehydrated
      # Each port listens on the most specific of its settings, e.g. http.host replaces network.host for HTTP
      - >-
        [elasticsearch_yml.http.bind_host | default(elasticsearch_yml.http.host)
         | default(elasticsearch_yml.network.bind_host) | default(elasticsearch_yml.network.host)
         | default('_local_')] | flatten is subset(elasticsearch_loopback)
      - >-
        [elasticsearch_yml.transport.bind_host | default(elasticsearch_yml.transport.host)
         | default(elasticsearch_yml.network.bind_host) | default(elasticsearch_yml.network.host)
         | default('_local_')] | flatten is subset(elasticsearch_loopback)
    fail_msg: >-
      xpack.security.enabled is false, but Elasticsearch is reachable from outside
      (elasticsearch.use_dehydrated is set, or the HTTP or transport port listens on a non-loopback address).
      Enable xpack.security or keep Elasticsearch local.

- name: Install Elasticsearch (Debian-based)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.include_tasks: install.yaml

- name: Configure Elasticsearch
  ansible.builtin.include_tasks: config.yaml

- name: Configure ElasticSearch plugins
  ansible.builtin.include_tasks: plugins.yaml

- name: Start the Elasticsearch service
  ansible.builtin.include_tasks: service.yaml

- name: Generate certificates for transport security
  when:
    - elasticsearch.transport_security.ca_from is defined
    - elasticsearch.transport_security.ca_from != None
  ansible.builtin.include_tasks: transport_security.yaml

- name: Restart Elasticsearch on config changes
  ansible.builtin.include_tasks: restart_elasticsearch.yaml

- name: Set password for elastic superuser (ES 8 or newer)
  when: elasticsearch.version is version('8', '>=') and elasticsearch["elasticsearch.yml"].xpack.security.enabled
  ansible.builtin.include_tasks: password.yaml

- name: Set up a reverse proxy for Elasticsearch
  when: elasticsearch.use_dehydrated
  ansible.builtin.include_tasks: reverse_proxy.yaml
